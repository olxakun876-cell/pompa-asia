<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Ilustrasi pompa submersible">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c30" />
      <stop offset="1" stop-color="#0a121f" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#1b2d49" stroke-width="1" />
    </pattern>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="120" y1="40" x2="500" y2="360">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" />
  <rect width="600" height="400" fill="url(#grid)" />

  <g transform="translate(0,18)" fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pipa keluar di bagian atas -->
    <path d="M300 96V52h62" stroke-width="4" />
    <rect x="360" y="38" width="14" height="28" rx="3" fill="#1b2d49" stroke-width="2" />

    <!-- Kabel power -->
    <path d="M262 128c-42 16-30 62-72 78" stroke="#3b82f6" stroke-width="3" opacity="0.75" />

    <!-- Badan pompa (motor + stage) -->
    <rect x="262" y="96" width="76" height="200" rx="38" fill="#16253c" stroke-width="3" />

    <!-- Stage / tingkat pompa -->
    <path d="M270 140h60M270 175h60M270 210h60M270 245h60" stroke="#2b4a70" stroke-width="2.5" />

    <!-- Kisi hisap di bagian bawah -->
    <path d="M254 296h92a8 8 0 0 1 8 8v14a8 8 0 0 1-8 8h-92a8 8 0 0 1-8-8v-14a8 8 0 0 1 8-8z"
          fill="#16253c" stroke-width="2.5" />
    <path d="M272 316v14M292 316v14M312 316v14M332 316v14" stroke="#2b4a70" stroke-width="2" />
  </g>

</svg>
