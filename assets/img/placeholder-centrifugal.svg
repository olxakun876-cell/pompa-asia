<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Ilustrasi pompa centrifugal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c30" />
      <stop offset="1" stop-color="#0a121f" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#1b2d49" stroke-width="1" />
    </pattern>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="120" y1="40" x2="500" y2="360">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" />
  <rect width="600" height="400" fill="url(#grid)" />

  <g transform="translate(0,18)" fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pipa discharge (keluar, atas) -->
    <path d="M392 134V82h84" stroke-width="4" />
    <rect x="474" y="68" width="14" height="28" rx="3" fill="#1b2d49" stroke-width="2" />

    <!-- Pipa suction (masuk, samping) -->
    <path d="M458 200h62" stroke-width="4" />
    <rect x="518" y="186" width="14" height="28" rx="3" fill="#1b2d49" stroke-width="2" />

    <!-- Dudukan / base plate -->
    <rect x="176" y="266" width="300" height="14" rx="7" fill="#16253c" stroke="#2b4a70" stroke-width="2" />

    <!-- Motor listrik -->
    <rect x="176" y="150" width="120" height="106" rx="14" fill="#16253c" stroke-width="2.5" />
    <rect x="190" y="166" width="92" height="74" rx="10" fill="none" stroke="#2b4a70" stroke-width="2" />
    <circle cx="236" cy="203" r="28" stroke-width="2" />
    <circle cx="236" cy="203" r="7" fill="url(#accent)" opacity="0.8" stroke="none" />

    <!-- Poros -->
    <rect x="296" y="197" width="32" height="12" rx="3" fill="url(#accent)" stroke="none" opacity="0.9" />

    <!-- Casing (rumah pompa) -->
    <circle cx="392" cy="200" r="66" fill="#16253c" stroke-width="3.5" />
    <circle cx="392" cy="200" r="40" stroke="#2b4a70" stroke-width="2" />

    <!-- Impeller -->
    <path d="M392 200l22-22M392 200l22 22M392 200l-22 22M392 200l-22-22" stroke-width="2" opacity="0.55" />
    <circle cx="392" cy="200" r="11" fill="url(#accent)" opacity="0.85" stroke="none" />
  </g>

</svg>
